name: Örnekleri doğrula
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: node tools/verify.mjs
      - run: dotnet build examples/dotnet/Faturaport.Examples.csproj --configuration Release
      - run: node tools/smoke-dotnet.mjs examples/dotnet/bin/Release/net8.0/Faturaport.Examples.dll
      - run: php -l examples/php/faturaport.php
